name: Slot14 inlinehook debug build

on:
  push:
    branches:
      - fix/inlinehook-slot14-debug-v1
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install compiler
        run: |
          curl -L -o arm-gnu-toolchain.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf arm-gnu-toolchain.tar.xz

      - name: Build Android kpimg
        shell: bash
        run: |
          set -euxo pipefail
          export TARGET_COMPILE="$PWD/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-"
          cd kernel
          export ANDROID=1
          make hdr kpimg
          mv kpimg kpimg-android
          mv kpimg.elf kpimg.elf-android
          sha256sum kpimg-android kpimg.elf-android

      - name: Upload kpimg-android
        uses: actions/upload-artifact@v4
        with:
          name: kpimg-android
          path: kernel/kpimg-android
          if-no-files-found: error

      - name: Upload kpimg.elf-android
        uses: actions/upload-artifact@v4
        with:
          name: kpimg.elf-android
          path: kernel/kpimg.elf-android
          if-no-files-found: error
