name: Slot14 inlinehook debug build

on:
  push:
    branches:
      - fix/inlinehook-slot14-debug-v1
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install compiler
        run: |
          curl -L -o arm-gnu-toolchain.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf arm-gnu-toolchain.tar.xz

      - name: Patch hook memory type matching
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("kernel/base/hmem.h")
          s = p.read_text()
          old = "void *hook_get_mem_from_origin(uint64_t origin_addr);"
          new = old + "\nvoid *hook_get_mem_from_origin_type(uint64_t origin_addr, enum hook_type type);"
          if s.count(old) != 1:
              raise SystemExit("hmem.h declaration anchor mismatch")
          p.write_text(s.replace(old, new, 1))

          p = Path("kernel/base/hmem.c")
          s = p.read_text()
          anchor = """void *hook_get_mem_from_origin(uint64_t origin_addr)\n{\n    uint64_t start = mem_region_start;\n\n    for (uint64_t addr = start; addr < mem_region_end; addr += sizeof(hook_mem_warp_t)) {\n        hook_mem_warp_t *wrap = (hook_mem_warp_t *)addr;\n        if (wrap->using && wrap->addr == origin_addr) {\n            uint64_t slot = (addr - mem_region_start) / sizeof(hook_mem_warp_t);\n            uint64_t chain = (uint64_t)&wrap->chain;\n            logkv(\"KP DBG hmem lookup: slot=%llu warp=%llx chain=%llx type=%d origin=%llx normal_transit=%llx fp_transit=%llx\\n\",\n                  slot, addr, chain, (int)wrap->type, (uint64_t)origin_addr,\n                  chain + 0x280, chain + 0x340);\n            return &wrap->chain;\n        }\n    }\n    return 0;\n}\n"""
          if s.count(anchor) != 1:
              raise SystemExit("hmem.c generic lookup anchor mismatch")
          helper = anchor + """\nvoid *hook_get_mem_from_origin_type(uint64_t origin_addr, enum hook_type type)\n{\n    uint64_t start = mem_region_start;\n\n    for (uint64_t addr = start; addr < mem_region_end; addr += sizeof(hook_mem_warp_t)) {\n        hook_mem_warp_t *wrap = (hook_mem_warp_t *)addr;\n        if (wrap->using && wrap->addr == origin_addr && wrap->type == type) {\n            uint64_t slot = (addr - mem_region_start) / sizeof(hook_mem_warp_t);\n            logkv(\"KP DBG hmem typed lookup: slot=%llu type=%d origin=%llx chain=%llx\\n\",\n                  slot, (int)wrap->type, (uint64_t)origin_addr, (uint64_t)&wrap->chain);\n            return &wrap->chain;\n        }\n    }\n    return 0;\n}\n"""
          p.write_text(s.replace(anchor, helper, 1))

          p = Path("kernel/base/hook.c")
          s = p.read_text()
          replacements = [
              ("hook_t *hook = hook_get_mem_from_origin(origin);\n    if (!hook) return;", "hook_t *hook = (hook_t *)hook_get_mem_from_origin_type(origin, INLINE);\n    if (!hook) return;"),
              ("hook_chain_t *chain = (hook_chain_t *)hook_get_mem_from_origin(origin);\n    if (chain) return hook_chain_add(chain, before, after, udata);", "hook_chain_t *chain = (hook_chain_t *)hook_get_mem_from_origin_type(origin, INLINE_CHAIN);\n    if (chain) return hook_chain_add(chain, before, after, udata);"),
              ("hook_chain_t *chain = (hook_chain_t *)hook_get_mem_from_origin(origin);\n    if (!chain) return;", "hook_chain_t *chain = (hook_chain_t *)hook_get_mem_from_origin_type(origin, INLINE_CHAIN);\n    if (!chain) return;"),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f"hook.c replacement anchor mismatch: {old[:60]}")
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path("kernel/base/fphook.c")
          s = p.read_text()
          replacements = [
              ("fp_hook_chain_t *chain = hook_get_mem_from_origin(fp_addr);", "fp_hook_chain_t *chain = (fp_hook_chain_t *)hook_get_mem_from_origin_type(fp_addr, FUNCTION_POINTER_CHAIN);"),
              ("fp_hook_chain_t *chain = (fp_hook_chain_t *)hook_get_mem_from_origin(fp_addr);", "fp_hook_chain_t *chain = (fp_hook_chain_t *)hook_get_mem_from_origin_type(fp_addr, FUNCTION_POINTER_CHAIN);"),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f"fphook.c replacement anchor mismatch: {old}")
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Patch inline install diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("kernel/base/hook.c")
          s = p.read_text()

          old = """    } else {\n        hook->tramp_insts_num = branch_absolute(hook->tramp_insts, hook->replace_addr);\n    }\n\n    // relocate\n"""
          new = """    } else {\n        hook->tramp_insts_num = branch_absolute(hook->tramp_insts, hook->replace_addr);\n    }\n\n    logkv(\"KP DBG hook_prepare: func=%llx origin=%llx replace=%llx relo=%llx tramp_num=%d tramp=%08x %08x %08x %08x %08x %08x\\n\",\n          hook->func_addr, hook->origin_addr, hook->replace_addr, hook->relo_addr, hook->tramp_insts_num,\n          hook->tramp_insts[0], hook->tramp_insts[1], hook->tramp_insts[2], hook->tramp_insts[3],\n          hook->tramp_insts[4], hook->tramp_insts[5]);\n\n    // relocate\n"""
          if s.count(old) != 1:
              raise SystemExit("hook_prepare diagnostics anchor mismatch")
          s = s.replace(old, new, 1)

          old = """    hook->relo_insts_num += branch_from_to(buf, back_src_addr, back_dst_addr);\n    return HOOK_NO_ERR;\n}\nKP_EXPORT_SYMBOL(hook_prepare);\n"""
          new = """    hook->relo_insts_num += branch_from_to(buf, back_src_addr, back_dst_addr);\n    logkv(\"KP DBG hook_prepare done: origin=%llx replace=%llx relo=%llx tramp_num=%d relo_num=%d origin=%08x %08x %08x %08x %08x %08x\\n\",\n          hook->origin_addr, hook->replace_addr, hook->relo_addr, hook->tramp_insts_num, hook->relo_insts_num,\n          hook->origin_insts[0], hook->origin_insts[1], hook->origin_insts[2],\n          hook->origin_insts[3], hook->origin_insts[4], hook->origin_insts[5]);\n    return HOOK_NO_ERR;\n}\nKP_EXPORT_SYMBOL(hook_prepare);\n"""
          if s.count(old) != 1:
              raise SystemExit("hook_prepare done diagnostics anchor mismatch")
          s = s.replace(old, new, 1)

          old = """void hook_install(hook_t *hook)\n{\n    void *addrs[TRAMPOLINE_MAX_NUM];\n    for (int32_t i = 0; i < hook->tramp_insts_num; ++i) {\n        addrs[i] = (uint32_t *)hook->origin_addr + i;\n    }\n    hotpatch(addrs, hook->tramp_insts, hook->tramp_insts_num);\n}\n"""
          new = """void hook_install(hook_t *hook)\n{\n    void *addrs[TRAMPOLINE_MAX_NUM];\n    for (int32_t i = 0; i < hook->tramp_insts_num; ++i) {\n        addrs[i] = (uint32_t *)hook->origin_addr + i;\n    }\n    logkv(\"KP DBG hook_install before: origin=%llx expected=%llx words=%08x %08x %08x %08x %08x %08x\\n\",\n          hook->origin_addr, hook->replace_addr, hook->tramp_insts[0], hook->tramp_insts[1],\n          hook->tramp_insts[2], hook->tramp_insts[3], hook->tramp_insts[4], hook->tramp_insts[5]);\n    int rc = hotpatch(addrs, hook->tramp_insts, hook->tramp_insts_num);\n    logkv(\"KP DBG hook_install after: rc=%d origin_words=%08x %08x %08x %08x %08x %08x\\n\",\n          rc, *((uint32_t *)hook->origin_addr + 0), *((uint32_t *)hook->origin_addr + 1),\n          *((uint32_t *)hook->origin_addr + 2), *((uint32_t *)hook->origin_addr + 3),\n          *((uint32_t *)hook->origin_addr + 4), *((uint32_t *)hook->origin_addr + 5));\n}\n"""
          if s.count(old) != 1:
              raise SystemExit("hook_install diagnostics anchor mismatch")
          s = s.replace(old, new, 1)

          old = """    for (int i = 0; i < transit_num; i++) {\n        transit[i + 6] = ((uint32_t *)transit_start)[i];\n    }\n    return HOOK_NO_ERR;\n}\n#else\n"""
          new = """    for (int i = 0; i < transit_num; i++) {\n        transit[i + 6] = ((uint32_t *)transit_start)[i];\n    }\n    logkv(\"KP DBG transit_prepare: transit=%llx chain=%llx argno=%d num=%d words=%08x %08x %08x %08x %08x %08x %08x %08x\\n\",\n          (uint64_t)transit, (uint64_t)chain, argno, transit_num,\n          transit[0], transit[1], transit[2], transit[3], transit[4], transit[5], transit[6], transit[7]);\n    return HOOK_NO_ERR;\n}\n#else\n"""
          if s.count(old) != 1:
              raise SystemExit("transit diagnostics anchor mismatch")
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Verify hook-memory and inline diagnostics patches
        run: |
          grep -n "hook_get_mem_from_origin_type" kernel/base/hmem.h kernel/base/hmem.c kernel/base/hook.c kernel/base/fphook.c
          grep -n "KP DBG hook_prepare\|KP DBG hook_install\|KP DBG transit_prepare" kernel/base/hook.c
          test "$(grep -c 'hook_get_mem_from_origin_type(origin, INLINE)' kernel/base/hook.c)" = 1
          test "$(grep -c 'hook_get_mem_from_origin_type(origin, INLINE_CHAIN)' kernel/base/hook.c)" = 2
          test "$(grep -c 'hook_get_mem_from_origin_type(fp_addr, FUNCTION_POINTER_CHAIN)' kernel/base/fphook.c)" = 2
          test "$(grep -c 'KP DBG hook_install after' kernel/base/hook.c)" = 1
          test "$(grep -c 'KP DBG transit_prepare' kernel/base/hook.c)" = 1

      - name: Build Android kpimg
        shell: bash
        run: |
          set -euxo pipefail
          export TARGET_COMPILE="$PWD/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-"
          cd kernel
          export ANDROID=1
          make hdr kpimg
          mv kpimg kpimg-android
          mv kpimg.elf kpimg.elf-android
          sha256sum kpimg-android kpimg.elf-android

      - name: Upload kpimg-android
        uses: actions/upload-artifact@v4
        with:
          name: kpimg-android
          path: kernel/kpimg-android

      - name: Upload kpimg.elf-android
        uses: actions/upload-artifact@v4
        with:
          name: kpimg.elf-android
          path: kernel/kpimg.elf-android
