name: Inlinehook I-cache all-PE test

on:
  push:
    branches:
      - fix/inlinehook-icache-all-0138
  workflow_dispatch:

jobs:
  build-kpimg-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply inlinehook I-cache fix
        shell: python
        run: |
          from pathlib import Path
          p = Path("kernel/base/hook.c")
          s = p.read_text()
          include_old = '#include <kpmalloc.h>\n#include "hmem.h"'
          include_new = '#include <kpmalloc.h>\n#ifndef KP_HOOK_EXTERNAL_CHAIN_PREPARE\n#include <cache.h>\n#endif\n#include "hmem.h"'
          if s.count(include_old) != 1:
              raise SystemExit(f"unexpected include context count: {s.count(include_old)}")
          s = s.replace(include_old, include_new, 1)
          body_old = '''    for (int i = 0; i < transit_num; i++) {\n        transit[i + 6] = ((uint32_t *)transit_start)[i];\n    }\n    return HOOK_NO_ERR;'''
          body_new = '''    for (int i = 0; i < transit_num; i++) {\n        transit[i + 6] = ((uint32_t *)transit_start)[i];\n    }\n\n    /* Publish generated executable code for all CPUs, not just the local I-cache. */\n    flush_icache_range((unsigned long)transit,\n                       (unsigned long)transit +\n                           (transit_num + 6) * sizeof(uint32_t));\n    flush_icache_all();\n    return HOOK_NO_ERR;'''
          if s.count(body_old) != 1:
              raise SystemExit(f"unexpected hook_chain_prepare body count: {s.count(body_old)}")
          s = s.replace(body_old, body_new, 1)
          p.write_text(s)

      - name: Verify patch
        run: |
          grep -n -A10 -B4 'flush_icache_range' kernel/base/hook.c
          test "$(grep -c '^#include <cache.h>$' kernel/base/hook.c)" = 1
          test "$(grep -c 'flush_icache_all();' kernel/base/hook.c)" = 1

      - name: Install compiler
        run: |
          curl -fL -o arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz

      - name: Build kpimg-android
        run: |
          export TARGET_COMPILE="$PWD/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-"
          cd kernel
          export ANDROID=1
          make hdr kpimg

      - name: Upload patched kpimg
        uses: actions/upload-artifact@v4
        with:
          name: kpimg-android-inlinehook-icache-all
          path: kernel/kpimg

      - name: Print SHA256
        run: sha256sum kernel/kpimg
